[project]
name = "redflag-eu-compliance"
version = "0.2.0"
description = "Local evidence-gate prototype; not a legal compliance assessment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
